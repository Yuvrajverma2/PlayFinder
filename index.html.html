<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayFinder — Pick Your Sport, Find Your Game</title>
<meta name="description" content="Pick a sport, get the rules, the skills, the kit and the academies near you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0B2B22;
    --pitch-2:#123626;
    --chalk:#F4EFE4;
    --chalk-dim:#CFC8B6;
    --amber:#E8A33D;
    --ink:#0E1B16;
    --line:rgba(244,239,228,0.14);
    --line-soft:rgba(244,239,228,0.08);
    --accent:#E8A33D;
    --accent-ink:#0E1B16;
    --radius:14px;
    --maxw:1180px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  body{
    margin:0;
    background:var(--pitch);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:0.02em;
    font-weight:400;
    line-height:0.95;
    margin:0;
  }
  .mono{ font-family:'JetBrains Mono',monospace; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  img{ max-width:100%; display:block; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 24px; }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }
  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(11,43,34,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .topbar .wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:64px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-size:1.05rem; }
  .brand .dot{
    width:11px; height:11px; border-radius:3px; background:var(--amber);
    transform:rotate(45deg);
    flex:none;
  }
  .brand-word{ font-family:'Bebas Neue'; font-size:1.4rem; letter-spacing:0.06em; }
  .topbar nav a{
    font-size:0.85rem; color:var(--chalk-dim); padding:8px 12px; border-radius:8px;
  }
  .topbar nav a:hover{ color:var(--chalk); background:var(--line-soft); }
  .ticker{
    border-bottom:1px solid var(--line-soft);
    overflow:hidden;
    white-space:nowrap;
    background:var(--pitch-2);
  }
  .ticker-track{
    display:inline-flex;
    animation:scroll-left 38s linear infinite;
  }
  @keyframes scroll-left{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  .ticker-item{
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 26px;
    font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--chalk-dim);
    border-right:1px solid var(--line-soft);
  }
  .ticker-item b{ color:var(--amber); font-weight:700; }
  .hero{
    position:relative;
    min-height:calc(100vh - 120px);
    padding:0;
    display:flex;
    align-items:center;
    overflow:hidden;
    background:var(--ink);
  }
  .hero .wrap{
    position:relative;
    z-index:1;
    padding-top:80px;
    padding-bottom:80px;
  }
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--amber); margin-bottom:22px;
  }
  .hero-eyebrow::before{
    content:''; width:26px; height:1px; background:var(--amber);
  }
  .hero h1{
    font-size:clamp(2.8rem, 7vw, 5.6rem);
    color:var(--chalk);
    max-width:900px;
  }
  .hero h1 span{ color:var(--amber); }
  .hero-sub{
    max-width:560px; margin:26px 0 34px;
    color:var(--chalk-dim); font-size:1.08rem; line-height:1.6;
  }
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--amber); color:var(--ink);
    padding:15px 26px; border-radius:999px; border:none;
    font-weight:700; font-size:0.95rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(232,163,61,0.28); }
  .btn-ghost{
    background:transparent; color:var(--chalk); border:1px solid var(--line);
  }
  .btn-ghost:hover{ background:var(--line-soft); }
  @media (max-width: 700px){
    .hero{ min-height:calc(100vh - 105px); }
    .hero .wrap{ padding-top:56px; padding-bottom:56px; }
    .hero-sub{ font-size:1rem; }
  }
  .section{ padding:76px 0; }
  .section-head{
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
    margin-bottom:36px; flex-wrap:wrap;
  }
  .section-eyebrow{
    font-size:0.75rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--amber);
    margin-bottom:10px; display:block;
  }
  .section-head h2{ font-size:clamp(2rem,4vw,3rem); color:var(--chalk); }
  .section-head p{ color:var(--chalk-dim); max-width:420px; margin:0; font-size:0.98rem; line-height:1.55; }
  .finder-bar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    margin-bottom:28px;
  }
  .finder-search{
    position:relative; flex:1 1 260px; min-width:220px;
  }
  .finder-search svg{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    color:var(--chalk-dim); pointer-events:none;
  }
  .finder-search input{
    width:100%; box-sizing:border-box;
    background:var(--pitch-2); border:1px solid var(--line); border-radius:999px;
    padding:13px 18px 13px 42px;
    font-family:'Inter'; font-size:0.95rem; color:var(--chalk);
  }
  .finder-search input::placeholder{ color:var(--chalk-dim); }
  .finder-search input:focus{ border-color:var(--amber); }
  .finder-count{
    font-family:'JetBrains Mono'; font-size:0.78rem; color:var(--chalk-dim);
    white-space:nowrap;
  }
  .finder-empty{
    display:none;
    padding:48px 20px; text-align:center; color:var(--chalk-dim);
    border:1px dashed var(--line); border-radius:var(--radius);
  }
  .finder-empty.show{ display:block; }
  .card.hide{ display:none; }
  .grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:16px;
  }
  @media (max-width:980px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }
  .card{
    position:relative;
    border-radius:var(--radius);
    padding:0;
    border:1px solid var(--line);
    background:var(--pitch-2);
    overflow:hidden;
    transition:transform .18s ease, border-color .18s ease;
    display:flex; flex-direction:column;
  }
  .card-photo{
    position:relative; height:130px; overflow:hidden;
  }
  .card-photo img{
    width:100%; height:100%; object-fit:cover;
    display:block;
    filter:saturate(0.85);
    transition:transform .4s ease, filter .4s ease;
  }
  .card:hover .card-photo img{ transform:scale(1.06); filter:saturate(1.05); }
  .card-photo::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--tint) 15%, transparent) 0%, var(--pitch-2) 100%);
  }
  .card-body{ padding:18px 20px 20px; display:flex; flex-direction:column; flex:1; position:relative; }
  .card-mono{
    font-family:'Bebas Neue'; font-size:2rem; color:var(--tint);
    letter-spacing:0.04em; position:relative;
    margin-top:-38px;
  }
  .card-name{ font-family:'Bebas Neue'; font-size:1.5rem; margin-top:10px; position:relative; letter-spacing:0.02em; }
  .card-tag{ color:var(--chalk-dim); font-size:0.86rem; margin-top:6px; position:relative; flex:1; }
  .card-cta{
    margin-top:16px; font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--tint); font-weight:700; display:flex; align-items:center; gap:6px; position:relative;
  }
  .card:hover{ transform:translateY(-4px); border-color:var(--tint); }
  .card:hover .card-cta{ gap:10px; }
  .card-cta svg{ transition:transform .18s ease; }
  footer{
    border-top:1px solid var(--line-soft); padding:40px 0; margin-top:20px;
  }
  footer .wrap{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
    color:var(--chalk-dim); font-size:0.84rem;
  }
  .gov-links{
    width:100%;
    margin-top:24px;
    padding-top:24px;
    border-top:1px solid var(--line-soft);
  }
  .gov-links-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:1.25rem;
    letter-spacing:0.04em;
    color:var(--chalk);
    margin-bottom:12px;
  }
  .gov-links-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .gov-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--pitch-2);
    color:var(--chalk-dim);
    font-size:0.82rem;
    font-weight:600;
    transition:transform .15s ease, border-color .15s ease, color .15s ease;
  }
  .gov-link:hover{
    transform:translateY(-2px);
    border-color:var(--amber);
    color:var(--chalk);
  }
  .gov-link::after{ content:'↗'; color:var(--amber); }
  @media (max-width:600px){
    .gov-links-grid{ flex-direction:column; }
    .gov-link{ width:100%; justify-content:space-between; }
  }
  .government-support{
    padding:58px 0 62px;
    border-top:1px solid var(--line-soft);
    border-bottom:1px solid var(--line-soft);
    background:
      radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--amber) 7%, transparent), transparent 65%),
      var(--pitch);
  }
  .government-support-head{
    text-align:center;
    max-width:720px;
    margin:0 auto 30px;
  }
  .government-support-eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    color:var(--amber);
    font-family:'JetBrains Mono',monospace;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
  }
  .government-support-eyebrow::before,
  .government-support-eyebrow::after{
    content:'';
    width:72px;
    height:1px;
    background:var(--amber);
    opacity:.65;
  }
  .government-support h2{
    margin:12px 0 8px;
    font-size:2rem;
    color:var(--chalk);
  }
  .government-support-intro{
    margin:0 auto;
    max-width:620px;
    color:var(--chalk-dim);
    font-size:.9rem;
    line-height:1.55;
  }
  .government-support-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
  }
  .government-card{
    display:flex;
    flex-direction:column;
    min-height:235px;
    padding:22px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--pitch-2);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .government-card:hover{
    transform:translateY(-4px);
    border-color:var(--amber);
    box-shadow:0 12px 30px rgba(0,0,0,.18);
  }
  .government-card-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
  }
  .government-icon{
    width:42px;
    height:42px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid color-mix(in srgb, var(--amber) 35%, var(--line));
    border-radius:10px;
    background:color-mix(in srgb, var(--amber) 8%, var(--pitch));
    font-size:1.55rem;
  }
  .government-card h3{
    margin:0;
    color:var(--chalk);
    font-size:1.08rem;
  }
  .government-card p{
    margin:0;
    color:var(--chalk-dim);
    font-size:.84rem;
    line-height:1.55;
    flex:1;
  }
  .government-card-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:18px;
    color:var(--amber);
    font-size:.78rem;
    font-weight:800;
    letter-spacing:.02em;
    text-transform:uppercase;
  }
  .government-card-link::after{
    content:'→';
    transition:transform .15s ease;
  }
  .government-card:hover .government-card-link::after{
    transform:translateX(4px);
  }
  @media (max-width:900px){
    .government-support-grid{grid-template-columns:1fr;}
    .government-card{min-height:0;}
  }
  @media (max-width:600px){
    .government-support{padding:44px 0 48px;}
    .government-support-eyebrow::before,
    .government-support-eyebrow::after{width:38px;}
    .government-support h2{font-size:1.7rem;}
  }
  .sport-hero{
    padding:0 0 54px;
    background:
      radial-gradient(ellipse at 85% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      linear-gradient(180deg, var(--pitch) 0%, var(--pitch-2) 100%);
    border-bottom:1px solid var(--line-soft);
  }
  .sport-photo{
    position:relative; height:280px; overflow:hidden; margin-bottom:40px;
  }
  .sport-photo img{
    width:100%; height:100%; object-fit:cover; display:block; filter:saturate(0.9);
  }
  .sport-photo::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--pitch) 10%, transparent) 0%, var(--pitch) 92%),
               linear-gradient(90deg, color-mix(in srgb, var(--pitch) 55%, transparent) 0%, transparent 45%);
  }
  .sport-photo-caption{
    position:absolute; left:0; bottom:14px; z-index:2;
    font-family:'JetBrains Mono'; font-size:0.7rem; color:var(--chalk-dim);
    padding:0 24px; max-width:var(--maxw); margin:0 auto; width:100%; box-sizing:border-box;
    left:50%; transform:translateX(-50%);
  }
  .sport-photo-inner{ position:absolute; inset:0; }
  @media (max-width:600px){ .sport-photo{ height:190px; } }
  .back-link{
    display:inline-flex; align-items:center; gap:8px; color:var(--chalk-dim);
    font-size:0.86rem; margin-bottom:30px;
  }
  .back-link:hover{ color:var(--chalk); }
  .sport-hero-top{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .sport-badge{
    width:78px; height:78px; border-radius:16px;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:2rem; letter-spacing:0.03em;
    flex:none;
    box-shadow:0 14px 30px -8px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .sport-hero h1{ font-size:clamp(3rem,8vw,5.4rem); color:var(--chalk); }
  .sport-hero .tagline{ color:var(--accent); font-size:1.15rem; margin-top:8px; font-weight:600; }
  .content-grid{
    display:grid; grid-template-columns:1.5fr 1fr; gap:60px; margin-top:54px;
  }
  @media (max-width:900px){ .content-grid{ grid-template-columns:1fr; gap:40px; } }
  .lede{ font-size:1.15rem; line-height:1.7; color:var(--chalk-dim); max-width:640px; }
  .scoreboard{
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    display:grid; grid-template-columns:1fr 1fr; gap:1px;
    background-image:none;
  }
  .scoreboard-cell{
    padding:16px 18px;
    border-bottom:1px solid var(--line-soft);
  }
  .scoreboard-cell:nth-child(odd){ border-right:1px solid var(--line-soft); }
  .scoreboard-label{
    font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--chalk-dim);
    margin-bottom:6px;
  }
  .scoreboard-value{
    font-family:'JetBrains Mono'; font-weight:700; color:var(--accent); font-size:1.18rem;
    text-shadow:0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  h2.h-block{
    font-size:1.9rem; color:var(--chalk); margin:0 0 20px;
    padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .subsection{ margin-top:58px; }
  .rules-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .rules-list li{
    display:flex; gap:14px; align-items:flex-start;
    padding:16px 18px; background:var(--pitch-2); border:1px solid var(--line); border-radius:12px;
    font-size:0.96rem; line-height:1.55; color:var(--chalk);
  }
  .rules-list li .tick{
    flex:none; width:22px; height:22px; border-radius:50%;
    background:color-mix(in srgb, var(--accent) 25%, transparent);
    color:var(--accent); display:flex; align-items:center; justify-content:center;
    font-size:0.75rem; font-weight:800; margin-top:2px;
  }
  .skills-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .skill-chip{
    padding:10px 18px; border-radius:999px;
    border:1px solid var(--line); background:var(--pitch-2);
    font-size:0.9rem; color:var(--chalk);
  }
  .skill-chip::before{ content:'●'; color:var(--accent); margin-right:8px; font-size:0.6rem; }
  .gear-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;
  }
  @media (max-width:900px){ .gear-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .gear-grid{ grid-template-columns:1fr; } }
  .gear-card{
    border:1px solid var(--line); background:var(--pitch-2); border-radius:12px; padding:20px;
    display:flex; flex-direction:column; gap:8px;
  }
  .gear-name{ font-weight:700; font-size:1.02rem; }
  .gear-price{ font-family:'JetBrains Mono'; color:var(--accent); font-size:0.88rem; font-weight:700; }
  .gear-desc{ color:var(--chalk-dim); font-size:0.87rem; line-height:1.5; flex:1; }
  .gear-link{
    margin-top:6px; font-size:0.8rem; font-weight:700; color:var(--accent);
    display:inline-flex; align-items:center; gap:6px;
  }
  .academy-box{
    border:1px solid var(--line); background:var(--pitch-2); border-radius:var(--radius);
    padding:26px;
  }
  .academy-box p{ color:var(--chalk-dim); font-size:0.92rem; line-height:1.6; margin:0 0 18px; }
  .academy-actions{ display:flex; flex-direction:column; gap:12px; }
  .academy-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .city-input{
    flex:1; min-width:140px;
    background:var(--ink); border:1px solid var(--line); color:var(--chalk);
    padding:12px 14px; border-radius:9px; font-size:0.9rem; font-family:inherit;
  }
  .city-input::placeholder{ color:var(--chalk-dim); }
  .btn-sm{ padding:12px 18px; border-radius:9px; font-size:0.86rem; }
  .geo-note{ font-size:0.76rem; color:var(--chalk-dim); margin-top:2px; }
  .injury-box{
    border:1px solid var(--line); background:var(--pitch-2); border-radius:var(--radius);
    padding:26px;
  }
  .injury-box > p{ color:var(--chalk-dim); font-size:0.92rem; line-height:1.6; margin:0 0 18px; }
  .injury-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .injury-select{
    flex:1; min-width:180px;
    background:var(--ink); border:1px solid var(--line); color:var(--chalk);
    padding:12px 14px; border-radius:9px; font-size:0.9rem; font-family:inherit;
  }
  .injury-result{
    margin-top:18px; padding:18px 20px; border-radius:12px;
    background:var(--ink); border:1px solid var(--line);
    display:none;
  }
  .injury-result.show{ display:block; }
  .injury-result h4{
    font-family:'Bebas Neue'; font-size:1.3rem; color:var(--accent); letter-spacing:0.02em; margin-bottom:10px;
  }
  .injury-result .symptoms{ color:var(--chalk-dim); font-size:0.86rem; margin-bottom:14px; line-height:1.5; }
  .injury-result .care-list{ list-style:none; margin:0 0 16px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .injury-result .care-list li{
    font-size:0.92rem; line-height:1.5; color:var(--chalk); display:flex; gap:10px; align-items:flex-start;
  }
  .injury-result .care-list li::before{ content:'✓'; color:var(--accent); font-weight:800; flex:none; }
  .injury-disclaimer{
    font-size:0.78rem; color:var(--chalk-dim); border-top:1px solid var(--line-soft); padding-top:12px; margin-top:4px;
  }
  .physio-finder{ margin-top:16px; padding-top:16px; border-top:1px solid var(--line-soft); display:none; }
  .physio-finder.show{ display:block; }
  .physio-finder p{ color:var(--chalk-dim); font-size:0.85rem; margin:0 0 12px; }

function wireHomeEvents(){
  const input=document.getElementById('sportSearch');
  const grid=document.getElementById('sportGrid');
  const empty=document.getElementById('sportEmpty');
  const emptyTerm=document.getElementById('sportEmptyTerm');
  const count=document.getElementById('sportCount');

  if(input&&grid){
    const cards=Array.from(grid.querySelectorAll('.card'));
    const total=cards.length;
    const updateCount=v=>count.textContent=v===total?`${total} sports`:`${v} of ${total}`;
    updateCount(total);
    input.addEventListener('input',()=>{
      const term=input.value.trim().toLowerCase();
      let visible=0;
      cards.forEach(card=>{
        const match=!term||card.dataset.name.includes(term)||card.dataset.tag.includes(term);
        card.classList.toggle('hide',!match);
        if(match)visible++;
      });
      updateCount(visible);
      empty.classList.toggle('show',visible===0);
      emptyTerm.textContent=input.value.trim();
    });
  }

  /* Universal hero search: sports + academies + locations. */
  const heroInput=document.getElementById('heroSportSearch');
  const heroBtn=document.getElementById('heroSearchBtn');
  const resultsBox=document.getElementById('heroSearchResults');
  const escapeHtml=v=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const locationHints=['Delhi','Gurugram','Gurgaon','Rewari','Rohtak','Sonipat','Hisar','Faridabad','Panipat','Karnal','Chandigarh','Jaipur','Noida','Mumbai','Pune','Bengaluru','Bangalore','Hyderabad','Chennai','Kolkata','Ahmedabad','Lucknow'];

  const classifyQuery=q=>{
    const raw=q.trim();
    const term=raw.toLowerCase();
    const sportMatches=SPORTS.filter(s=>{
      const hay=[s.name,s.slug,s.tagline,s.desc].join(' ').toLowerCase();
      return hay.includes(term);
    });
    const exactSport=SPORTS.find(s=>s.name.toLowerCase()===term||s.slug===term);
    const looksLikeLocation=locationHints.some(x=>term===x.toLowerCase()||term.includes(x.toLowerCase())) || /\b(city|location|near me|nearby|delhi|gurugram|gurgaon|rewari|rohtak|sonipat|hisar|faridabad|panipat|karnal|chandigarh|jaipur|noida|mumbai|pune|bengaluru|bangalore|hyderabad|chennai|kolkata|ahmedabad|lucknow)\b/i.test(raw);
    const looksLikeAcademy=/\b(academy|academies|training|centre|center|club|school|institute|gym|stadium|ground|court|pool|physio|physiotherapy)\b/i.test(raw);
    return {raw,term,exactSport,sportMatches,looksLikeLocation,looksLikeAcademy};
  };

  const hideResults=()=>{resultsBox?.classList.remove('show');if(resultsBox)resultsBox.innerHTML='';heroInput?.setAttribute('aria-expanded','false');};
  const openDirectory=(q,focusCity=false)=>{
    sessionStorage.setItem('playfinderDirectoryQuery',q);
    sessionStorage.setItem('playfinderDirectoryCity',focusCity?q:'');
    location.hash='#/map';
  };
  const openMaps=(q)=>window.open('https://www.google.com/maps/search/'+encodeURIComponent(q),'_blank','noopener');

  const makeItem=(title,meta,icon,action)=>`<button type="button" class="hero-search-item" data-action="${action}"><span class="hero-search-icon">${icon}</span><span class="hero-search-copy"><span class="hero-search-title">${pfEscapeHtml(title)}</span><span class="hero-search-meta">${pfEscapeHtml(meta)}</span></span><span class="hero-search-arrow">→</span></button>`;

  const showSuggestions=()=>{
    if(!heroInput||!resultsBox)return;
    const q=heroInput.value.trim();
    if(!q){hideResults();return;}
    const c=classifyQuery(q);
    let html='';
    c.sportMatches.slice(0,3).forEach(s=>{html+=makeItem(s.name,'Sport · Explore sport page','S','sport:'+s.slug)});
    if(c.looksLikeAcademy){html+=makeItem(q,'Academy / facility · Search current listings','A','academy:'+q);}
    if(c.looksLikeLocation){html+=makeItem(q,'Location · Find sports academies and facilities','L','location:'+q);}
    if(!html){
      html=makeItem(`Search “${q}”`,'Academy, facility or location · Open Sports Directory','⌕','directory:'+q);
    }
    resultsBox.innerHTML=html;
    resultsBox.classList.add('show');
    heroInput.setAttribute('aria-expanded','true');
  };

  const runHeroSearch=()=>{
    const q=(heroInput?.value||'').trim();
    if(!q){document.getElementById('choose')?.scrollIntoView({behavior:'smooth'});return;}
    const c=classifyQuery(q);
    if(c.exactSport){hideResults();location.hash='#/sports/'+c.exactSport.slug;return;}
    if(c.looksLikeAcademy){hideResults();openMaps(q);return;}
    if(c.looksLikeLocation){hideResults();openMaps('sports academies and facilities in '+q);return;}
    if(c.sportMatches.length){hideResults();location.hash='#/sports/'+c.sportMatches[0].slug;return;}
    hideResults();openDirectory(q,false);
  };

  heroInput?.addEventListener('input',showSuggestions);
  heroBtn?.addEventListener('click',runHeroSearch);
  heroInput?.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();runHeroSearch();}
    if(e.key==='Escape')hideResults();
  });
  resultsBox?.addEventListener('click',e=>{
    const item=e.target.closest('.hero-search-item');
    if(!item)return;
    const [action,value]=item.dataset.action.split(':');
    hideResults();
    if(action==='sport')location.hash='#/sports/'+value;
    else if(action==='academy')openMaps(value);
    else if(action==='location')openMaps('sports academies and facilities in '+value);
    else openDirectory(value,false);
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.hero-search-wrap'))hideResults();});
}

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function scoreSport(s,p){
  let score=55, reasons=[]; const text=(s.desc+' '+s.tagline).toLowerCase();
  if(p.goal==='Fitness' && /fitness|conditioning|speed|endurance|explosive|movement/.test(text)){score+=12;reasons.push('fits a fitness-focused goal');}
  if(p.goal==='Competition' && /match|team|championship|competition|tournament/.test(text)){score+=13;reasons.push('has a clear competitive pathway');}
  if(p.goal==='Career' && /governing body|national|professional|championship/.test(text)){score+=13;reasons.push('has an established competition structure');}
  if(p.environment==='Indoor' && /court|indoor|pool|hall|gym/.test(text)){score+=10;reasons.push('works well indoors');}
  if(p.environment==='Outdoor' && /field|pitch|track|water|outdoor/.test(text)){score+=10;reasons.push('matches an outdoor preference');}
  if(p.group==='Team' && /team|side|players|relay|squad/.test(text)){score+=10;reasons.push('has a strong team element');}
  if(p.group==='Solo' && !/team|side|players per side/.test(text)){score+=7;reasons.push('can be trained with a more individual focus');}
  const gearBudget=s.gear.slice(0,2).reduce((n,g)=>n+parseInt((g[1].match(/[0-9,]+/)||['0'])[0].replace(/,/g,'')),0);
  if(p.budget>=gearBudget){score+=7;reasons.push('fits the selected starter budget');}
  if(p.level==='Advanced')score+=/governing body|championship/.test(text)?5:0;
  score=Math.max(50,Math.min(98,score)); if(!reasons.length)reasons.push('balanced starting option based on your preferences');
  return {score,reasons:reasons.slice(0,3)};
}
function renderMap(){const savedQuery=sessionStorage.getItem('playfinderDirectoryQuery')||'';const savedCity=sessionStorage.getItem('playfinderDirectoryCity')||'';return `<header class="topbar"><div class="wrap"><a class="brand" href="#/"><span class="dot"></span><span class="brand-word">PlayFinder</span></a><nav><a href="#/">Home</a></nav></div></header><section class="section"><div class="wrap"><span class="eyebrow-small">SPORTS DIRECTORY</span><h1 style="font-size:clamp(3rem,7vw,5rem);margin:10px 0 12px">Sports directory.</h1><p class="lede">Search live map results for academies, grounds, gyms and sports physiotherapy. PlayFinder uses your query to open current map listings instead of storing stale business data.</p><div class="smart-panel directory-panel"><div class="map-tools"><div><label>Sport / service</label><input id="mapQuery" value="${pfEscapeHtml(savedQuery)}" placeholder="e.g. badminton academy, swimming pool"></div><div><label>City</label><input id="mapCity" value="${pfEscapeHtml(savedCity)}" placeholder="e.g. Delhi"></div><button class="btn" id="mapSearch">Search directory</button></div><div class="map-grid">${[['Academies','academy'],['Grounds & courts','ground'],['Sports physiotherapy','sports physiotherapist'],['Gyms','gym'],['Sports shops','sports shop'],['Swimming pools','swimming pool']].map(x=>`<div class="map-card"><h3>${x[0]}</h3><p>Search current listings near your city or location.</p><button class="btn btn-sm btn-ghost mapQuick" data-q="${x[1]}">Open ${x[0]} →</button></div>`).join('')}</div></div></div></section>`}
function wireMap(){const open=q=>{const city=document.getElementById('mapCity').value.trim();const sport=document.getElementById('mapQuery').value.trim();const query=city?`${sport||q} ${city}`:(sport||q);window.open('https://www.google.com/maps/search/'+encodeURIComponent(query),'_blank','noopener');sessionStorage.removeItem('playfinderDirectoryQuery');sessionStorage.removeItem('playfinderDirectoryCity');};document.getElementById('mapSearch').addEventListener('click',()=>open('sports academy'));document.querySelectorAll('.mapQuick').forEach(b=>b.addEventListener('click',()=>open(b.dataset.q)));}
function renderCommunity(){return `<header class="topbar"><div class="wrap"><a class="brand" href="#/"><span class="dot"></span><span class="brand-word">PlayFinder</span></a><nav></nav></div></header><section class="section"><div class="wrap"><span class="eyebrow-small">ATHLETE COMMUNITY</span><h1 style="font-size:clamp(3rem,7vw,5rem);margin:10px 0 30px">Train. Track. Share.</h1><div class="community-grid"><div class="community-card"><h2 class="h-block">Community feed</h2><div class="feed-item"><strong>Athlete #1042 · Badminton</strong><p>Completed 45 minutes of footwork drills and logged a new personal best.</p><span class="tag">+40 XP</span></div><div class="feed-item"><strong>Athlete #781 · Athletics</strong><p>Started a 4-week sprint consistency challenge.</p><span class="tag">Challenge</span></div><div class="feed-item"><strong>Athlete #220 · Swimming</strong><p>Finished a beginner endurance session and unlocked a streak badge.</p><span class="tag">Achievement</span></div><p style="font-size:.72rem;color:var(--chalk-dim);margin-top:16px">Demo community data — connect a real backend/database before production.</p></div><div class="community-card"><h2 class="h-block">Leaderboard</h2>${[['01','Athlete #1042','1,280 XP'],['02','Athlete #781','1,110 XP'],['03','Athlete #220','980 XP'],['04','Athlete #563','840 XP'],['05','Athlete #917','760 XP']].map(x=>`<div class="leader-row"><span class="rank">${x[0]}</span><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}<div style="margin-top:18px"><span class="tag">Achievements</span><p style="font-size:.8rem;color:var(--chalk-dim);line-height:1.5">🏅 First Match · 🔥 7-Day Streak · 🎯 Skill Starter · 🏃 Training Week</p></div></div></div></div></section><footer><div class="wrap"><span>PlayFinder community — demo mode</span><a href="#/">Back home</a></div></footer>`}
function showToast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(window.__pfToast);window.__pfToast=setTimeout(()=>t.classList.remove('show'),2200)}
function renderSport(slug){
  const s=bySlug(slug); if(!s)return renderNotFound();
  const stats=s.stats.map(([label,value])=>`<div class="scoreboard-cell"><div class="scoreboard-label">${label}</div><div class="scoreboard-value">${value}</div></div>`).join('');
  const rules=s.rules.map(r=>`<li><span class="tick">✓</span><span>${r}</span></li>`).join('');
  const skills=s.skills.map(sk=>`<span class="skill-chip">${sk}</span>`).join('');
  const gear=s.gear.map(([name,price,desc],i)=>`<div class="gear-card" data-gear-index="${i}"><input class="gear-check" type="checkbox" data-gear="${i}" aria-label="Compare ${name}"><div class="gear-name">${name}</div><div class="gear-price">${price}</div><div class="gear-desc">${desc}</div><a class="gear-link" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=shop&q=${encodeURIComponent(s.name+' '+name)}">Shop options ${ARROW}</a></div>`).join('');
  const injuryOptions=s.injuries.map((inj,i)=>`<option value="${i}">${inj.name}</option>`).join('');
  const lessons=[{k:'Beginner fundamentals',q:`${s.name} tutorial for beginners`,d:`Start from scratch with ${s.skills[0].toLowerCase()} and core movement.`},{k:'Pro technique breakdown',q:`${s.name} technique breakdown pro`,d:`Slow-motion form checks and coaching breakdowns for ${s.name.toLowerCase()}.`},{k:'Training drills',q:`${s.name} training drills`,d:`Structured drills to build ${s.skills[Math.min(2,s.skills.length-1)].toLowerCase()} and match fitness.`}].map(l=>`<div class="lesson-card"><div class="lesson-kicker">${l.k}</div><div class="lesson-name">${s.name}: ${l.k.toLowerCase()}</div><div class="lesson-desc">${l.d}</div><a class="lesson-link" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(l.q)}">Watch on YouTube ${ARROW}</a></div>`).join('');
  const others=SPORTS.filter(x=>x.slug!==s.slug).map(x=>`<a class="pill" href="#/sports/${x.slug}">${x.name}</a>`).join('');
  return `<header class="topbar"><div class="wrap"><a class="brand" href="#/"><span class="dot"></span><span class="brand-word">PlayFinder</span></a><nav></nav></div></header>
  <section class="sport-hero" style="--accent:${s.accent}"><div class="sport-photo"><img src="${s.photo}" alt="${s.name} in action — ${s.tagline}"><span class="sport-photo-caption">${s.photoCredit}</span></div><div class="wrap"><a class="back-link" href="#/">${CHEV_LEFT} All sports</a><div class="sport-hero-top"><div class="sport-badge">${s.mono}</div><div><h1>${s.name}</h1><div class="tagline">${s.tagline}</div></div></div><div class="content-grid"><div><h2 class="h-block">The game</h2><p class="lede">${s.desc}</p></div><div class="scoreboard">${stats}</div></div></div></section>
  <section class="section" style="--accent:${s.accent};padding-top:56px"><div class="wrap">
    <div class="smart-panel" style="margin-top:0"><span class="eyebrow-small">YOUR PATH WITH ${s.name.toUpperCase()}</span><h2>From first session to competition.</h2><p>Use the guide below as a practical roadmap. Your exact progression depends on coaching, performance, competitions and the rules of the relevant federation.</p><div class="path">${['Discover','Train','Local','District','State','National+'].map((x,i)=>`<div class="path-step ${i===0?'active':''}"><div class="path-num">${i+1}</div><strong>${x}</strong><small>${['Learn rules & basics','Build skills & fitness','Join local coaching','Compete at district level','Progress through state level','Target higher competition'][i]}</small></div>`).join('')}</div></div>
    <div class="subsection" style="margin-top:58px"><h2 class="h-block">Rules that matter</h2><ul class="rules-list">${rules}</ul></div>
    <div class="subsection"><h2 class="h-block">Skills to train</h2><div class="skills-row">${skills}</div></div>
    <div class="subsection"><h2 class="h-block">Gear &amp; accessories</h2><div class="compare-bar"><p class="compare-note">Select up to 3 items to compare your starter kit. Prices are the guide's approximate ranges.</p><button class="btn btn-sm btn-ghost" id="compareGearBtn">Compare selected</button></div><div class="gear-grid" id="gearGrid">${gear}</div><div class="compare-result" id="compareResult"></div></div>
    <div class="subsection"><h2 class="h-block">First-response injury guide</h2><div class="injury-box"><p>Choose a listed issue for general first-response information. This tool does <b>not</b> diagnose injuries.</p><div class="injury-row"><select class="injury-select" id="injurySelect"><option value="" selected disabled>Select an issue…</option>${injuryOptions}</select><button class="btn btn-sm" id="injuryBtn" style="background:${s.accent}">Show guidance</button></div><div class="injury-result" id="injuryResult"><h4 id="injuryName"></h4><div class="symptoms" id="injurySymptoms"></div><ul class="care-list" id="injuryCare"></ul><div class="injury-disclaimer">General information only — not medical advice or a diagnosis. Seek qualified medical care for severe, sudden, worsening or persistent symptoms.</div></div><div class="safety-grid"><div class="red-flag"><b>Stop &amp; seek urgent care:</b> major deformity, inability to bear weight/use the limb, severe swelling, loss of sensation, chest pain, breathing difficulty or a suspected serious head/neck injury.</div><div class="red-flag"><b>Return-to-play rule:</b> don't use this page as clearance to compete. A qualified professional should assess significant or persistent injury.</div></div><div class="physio-finder" id="physioFinder"><p>Need professional help? Search for a sports physiotherapist near you.</p><div class="academy-actions"><div class="academy-row"><button class="btn btn-sm" id="physioGeoBtn" style="background:${s.accent}">Use my location</button></div><div class="geo-note" id="physioGeoNote"></div><div class="academy-row"><input class="city-input" id="physioCityInput" placeholder="Or type a city, e.g. Mumbai"><button class="btn btn-ghost btn-sm" id="physioCitySearchBtn">Search</button></div></div></div></div></div>
    <div class="subsection"><h2 class="h-block">Learn from the pros</h2><p style="color:var(--chalk-dim);margin:-10px 0 22px;font-size:.95rem">Search curated YouTube results for fundamentals, technique and drills.</p><div class="lesson-grid">${lessons}</div></div>
    <div class="subsection"><h2 class="h-block">Academies &amp; facilities near you</h2><div class="academy-box"><p>Use the live Sports Directory for current listings instead of relying on a static directory.</p><div class="profile-actions"><a class="btn btn-sm" href="#/map">Open Sports Directory</a><button class="btn btn-ghost btn-sm" id="quickAcademy">Search ${s.name} on Maps</button></div></div></div>
</div>
    <div class="subsection"><h2 class="h-block">Try another sport</h2><div class="other-sports">${others}</div></div>
  </div></section><footer><div class="wrap"><span>PlayFinder — ${s.name} guide</span><a href="#/">Back to all sports</a><div class="gov-links"><div class="gov-links-title">Official Government Sports Resources</div><div class="gov-links-grid"><a class="gov-link" href="https://kheloindia.gov.in/" target="_blank" rel="noopener">Khelo India</a><a class="gov-link" href="https://fitindia.gov.in/" target="_blank" rel="noopener">Fit India</a><a class="gov-link" href="https://www.sportsauthorityofindia.gov.in/" target="_blank" rel="noopener">Sports Authority of India (SAI)</a></div></div></div></footer>`;
}
function renderNotFound(){
  return `
    <header class="topbar">
      <div class="wrap">
        <a class="brand" href="#/"><span class="dot"></span><span class="brand-word">PlayFinder</span></a>
      </div>
    </header>
    <section class="section"><div class="wrap">
      <h1 style="font-size:3rem;">Sport not found</h1>
      <p style="color:var(--chalk-dim); margin:16px 0 26px;">That guide doesn't exist yet.</p>
      <a class="btn" href="#/">Back to all sports</a>
    </div></section>
  `;
}
function wireSportPageEvents(slug){
  const s=bySlug(slug);if(!s)return;
  const geoBtn=document.getElementById('geoBtn'),geoNote=document.getElementById('geoNote'),cityInput=document.getElementById('cityInput'),cityBtn=document.getElementById('citySearchBtn');
  geoBtn&&geoBtn.addEventListener('click',()=>{if(!navigator.geolocation){geoNote.textContent="Location isn't available — use Sports Directory instead.";return;}geoNote.textContent='Finding your location…';navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude}=pos.coords;geoNote.textContent='';window.open(`https://www.google.com/maps/search/${encodeURIComponent(s.name+' academy')}/@${latitude},${longitude},13z`,'_blank')},()=>geoNote.textContent="Couldn't access location — use Sports Directory instead.")});
  cityBtn&&cityBtn.addEventListener('click',()=>{const city=cityInput.value.trim();window.open('https://www.google.com/maps/search/'+encodeURIComponent(`${s.name} academy ${city}`),'_blank')});
  const injuryBtn=document.getElementById('injuryBtn');injuryBtn&&injuryBtn.addEventListener('click',()=>{const idx=document.getElementById('injurySelect').value;if(idx==='')return;const inj=s.injuries[Number(idx)];document.getElementById('injuryName').textContent=inj.name;document.getElementById('injurySymptoms').textContent=`Common symptoms: ${inj.symptoms}`;document.getElementById('injuryCare').innerHTML=inj.care.map(c=>`<li>${c}</li>`).join('');document.getElementById('injuryResult').classList.add('show');document.getElementById('physioFinder').classList.add('show')});
  const pg=document.getElementById('physioGeoBtn');pg&&pg.addEventListener('click',()=>{const n=document.getElementById('physioGeoNote');if(!navigator.geolocation){n.textContent='Location unavailable — type a city.';return}n.textContent='Finding your location…';navigator.geolocation.getCurrentPosition(pos=>{n.textContent='';window.open(`https://www.google.com/maps/search/${encodeURIComponent('sports physiotherapist')}/@${pos.coords.latitude},${pos.coords.longitude},13z`,'_blank')},()=>n.textContent='Could not access location — type a city.')});
  document.getElementById('physioCitySearchBtn')?.addEventListener('click',()=>{const c=document.getElementById('physioCityInput').value.trim();window.open('https://www.google.com/maps/search/'+encodeURIComponent(`sports physiotherapist ${c}`),'_blank')});
  document.getElementById('quickAcademy')?.addEventListener('click',()=>window.open('https://www.google.com/maps/search/'+encodeURIComponent(s.name+' academy'),'_blank'));
  document.getElementById('compareGearBtn')?.addEventListener('click',()=>{const ids=Array.from(document.querySelectorAll('.gear-check:checked')).slice(0,3).map(x=>Number(x.dataset.gear));const box=document.getElementById('compareResult');if(!ids.length){box.classList.remove('show');showToast('Select at least one gear item.');return}ids.forEach(i=>document.querySelector(`[data-gear-index="${i}"]`)?.classList.add('selected'));box.classList.add('show');box.innerHTML='<table class="compare-table"><thead><tr><th>Item</th><th>Price</th><th>Why it matters</th></tr></thead><tbody>'+ids.map(i=>`<tr><td>${s.gear[i][0]}</td><td>${s.gear[i][1]}</td><td>${s.gear[i][2]}</td></tr>`).join('')+'</tbody></table>'});
  const coach=(q)=>{const t=q.toLowerCase();if(/gear|kit|buy|equipment/.test(t))return `<b>Starter gear:</b> ${s.gear.slice(0,3).map(g=>`${g[0]} (${g[1]})`).join(', ')}.`;if(/skill|train|practice|drill/.test(t))return `<b>Train first:</b> ${s.skills.slice(0,3).join(', ')}. Start with ${s.skills[0]} and build quality before intensity.`;if(/rule|play/.test(t))return `<b>Key rules:</b> ${s.rules.slice(0,3).join(' ')}`;if(/injury|pain|hurt/.test(t))return `Use the <b>First-response injury guide</b> above for general information. It does not diagnose injuries.`;if(/career|professional|path/.test(t))return `<b>Pathway:</b> Discover → Train → Local → District → State → National+. Exact standards vary by sport and federation.`;return `Try asking about <b>gear, skills, rules, injury precautions, career path</b> or training for ${s.name}.`};
  document.getElementById('sportCoachAsk')?.addEventListener('click',()=>{const r=document.getElementById('sportCoachResponse');r.innerHTML=coach(document.getElementById('sportCoachInput').value);r.classList.add('show')});
}
function render(){const hash=location.hash||'#/';const app=document.getElementById('app');
  if(/^#\/sports\//.test(hash)){const slug=hash.split('/')[2];app.innerHTML=renderSport(slug);document.title=(bySlug(slug)?bySlug(slug).name+' Guide':'Sport not found')+' | PlayFinder';wireSportPageEvents(slug);}
  else if(hash==='#/map'){app.innerHTML=renderMap();document.title='Sports Directory | PlayFinder';wireMap();}
  else if(hash==='#/community'){app.innerHTML=renderCommunity();document.title='Athlete Community | PlayFinder';}
  else if(hash==='#/recommend'||hash==='#/profile'||hash==='#/coach'){location.hash='#/';return;}
  else{app.innerHTML=renderHome();document.title='PlayFinder — Pick Your Sport, Find Your Game';wireHomeEvents();}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);window.addEventListener('DOMContentLoaded',()=>{document.body.insertAdjacentHTML('beforeend','<div class="toast" id="toast"></div>');render()});
</script>
</body>
</html>
