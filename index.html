<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayFinder — Pick Your Sport, Find Your Game</title>
<meta name="description" content="Pick a sport, get the rules, the skills, the kit and the academies near you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#0B2B22;
    --pitch-2:#123626;
    --chalk:#F4EFE4;
    --chalk-dim:#CFC8B6;
    --amber:#E8A33D;
    --ink:#0E1B16;
    --line:rgba(244,239,228,0.14);
    --line-soft:rgba(244,239,228,0.08);
    --accent:#E8A33D;
    --accent-ink:#0E1B16;
    --radius:14px;
    --maxw:1180px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  body{
    margin:0;
    background:var(--pitch);
    color:var(--chalk);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:0.02em;
    font-weight:400;
    line-height:0.95;
    margin:0;
  }
  .mono{ font-family:'JetBrains Mono',monospace; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  img{ max-width:100%; display:block; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:0 24px; }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:rgba(11,43,34,0.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line-soft);
  }
  .topbar .wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:64px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-size:1.05rem; }
  .brand .dot{
    width:11px; height:11px; border-radius:3px; background:var(--amber);
    transform:rotate(45deg);
    flex:none;
  }
  .brand-word{ font-family:'Bebas Neue'; font-size:1.4rem; letter-spacing:0.06em; }
  .topbar nav a{
    font-size:0.85rem; color:var(--chalk-dim); padding:8px 12px; border-radius:8px;
  }
  .topbar nav a:hover{ color:var(--chalk); background:var(--line-soft); }

  /* ---------- ticker ---------- */
  .ticker{
    border-bottom:1px solid var(--line-soft);
    overflow:hidden;
    white-space:nowrap;
    background:var(--pitch-2);
  }
  .ticker-track{
    display:inline-flex;
    animation:scroll-left 38s linear infinite;
  }
  @keyframes scroll-left{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  .ticker-item{
    display:inline-flex; align-items:center; gap:10px;
    padding:10px 26px;
    font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--chalk-dim);
    border-right:1px solid var(--line-soft);
  }
  .ticker-item b{ color:var(--amber); font-weight:700; }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    padding:88px 0 70px;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 118px, var(--line-soft) 118px, var(--line-soft) 119px),
      radial-gradient(ellipse at 20% 0%, rgba(232,163,61,0.14), transparent 55%),
      linear-gradient(180deg, var(--pitch) 0%, var(--pitch-2) 100%);
    overflow:hidden;
  }
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--amber); margin-bottom:22px;
  }
  .hero-eyebrow::before{
    content:''; width:26px; height:1px; background:var(--amber);
  }
  .hero h1{
    font-size:clamp(2.8rem, 7vw, 5.6rem);
    color:var(--chalk);
    max-width:900px;
  }
  .hero h1 span{ color:var(--amber); }
  .hero-sub{
    max-width:560px; margin:26px 0 34px;
    color:var(--chalk-dim); font-size:1.08rem; line-height:1.6;
  }
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--amber); color:var(--ink);
    padding:15px 26px; border-radius:999px; border:none;
    font-weight:700; font-size:0.95rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(232,163,61,0.28); }
  .btn-ghost{
    background:transparent; color:var(--chalk); border:1px solid var(--line);
  }
  .btn-ghost:hover{ background:var(--line-soft); }

  /* ---------- section heads ---------- */
  .section{ padding:76px 0; }
  .section-head{
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
    margin-bottom:36px; flex-wrap:wrap;
  }
  .section-eyebrow{
    font-size:0.75rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--amber);
    margin-bottom:10px; display:block;
  }
  .section-head h2{ font-size:clamp(2rem,4vw,3rem); color:var(--chalk); }
  .section-head p{ color:var(--chalk-dim); max-width:420px; margin:0; font-size:0.98rem; line-height:1.55; }

  /* ---------- sport grid (home) ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:16px;
  }
  @media (max-width:980px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }

  .card{
    position:relative;
    border-radius:var(--radius);
    padding:0;
    border:1px solid var(--line);
    background:var(--pitch-2);
    overflow:hidden;
    transition:transform .18s ease, border-color .18s ease;
    display:flex; flex-direction:column;
  }
  .card-photo{
    position:relative; height:130px; overflow:hidden;
  }
  .card-photo img{
    width:100%; height:100%; object-fit:cover;
    display:block;
    filter:saturate(0.85);
    transition:transform .4s ease, filter .4s ease;
  }
  .card:hover .card-photo img{ transform:scale(1.06); filter:saturate(1.05); }
  .card-photo::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--tint) 15%, transparent) 0%, var(--pitch-2) 100%);
  }
  .card-body{ padding:18px 20px 20px; display:flex; flex-direction:column; flex:1; position:relative; }
  .card-mono{
    font-family:'Bebas Neue'; font-size:2rem; color:var(--tint);
    letter-spacing:0.04em; position:relative;
    margin-top:-38px;
  }
  .card-name{ font-family:'Bebas Neue'; font-size:1.5rem; margin-top:10px; position:relative; letter-spacing:0.02em; }
  .card-tag{ color:var(--chalk-dim); font-size:0.86rem; margin-top:6px; position:relative; flex:1; }
  .card-cta{
    margin-top:16px; font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--tint); font-weight:700; display:flex; align-items:center; gap:6px; position:relative;
  }
  .card:hover{ transform:translateY(-4px); border-color:var(--tint); }
  .card:hover .card-cta{ gap:10px; }
  .card-cta svg{ transition:transform .18s ease; }

  /* ---------- footer ---------- */
  footer{
    border-top:1px solid var(--line-soft); padding:40px 0; margin-top:20px;
  }
  footer .wrap{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
    color:var(--chalk-dim); font-size:0.84rem;
  }

  /* ---------- SPORT PAGE ---------- */
  .sport-hero{
    padding:0 0 54px;
    background:
      radial-gradient(ellipse at 85% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      linear-gradient(180deg, var(--pitch) 0%, var(--pitch-2) 100%);
    border-bottom:1px solid var(--line-soft);
  }
  .sport-photo{
    position:relative; height:280px; overflow:hidden; margin-bottom:40px;
  }
  .sport-photo img{
    width:100%; height:100%; object-fit:cover; display:block; filter:saturate(0.9);
  }
  .sport-photo::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, color-mix(in srgb, var(--pitch) 10%, transparent) 0%, var(--pitch) 92%),
               linear-gradient(90deg, color-mix(in srgb, var(--pitch) 55%, transparent) 0%, transparent 45%);
  }
  .sport-photo-caption{
    position:absolute; left:0; bottom:14px; z-index:2;
    font-family:'JetBrains Mono'; font-size:0.7rem; color:var(--chalk-dim);
    padding:0 24px; max-width:var(--maxw); margin:0 auto; width:100%; box-sizing:border-box;
    left:50%; transform:translateX(-50%);
  }
  .sport-photo-inner{ position:absolute; inset:0; }
  @media (max-width:600px){ .sport-photo{ height:190px; } }
  .back-link{
    display:inline-flex; align-items:center; gap:8px; color:var(--chalk-dim);
    font-size:0.86rem; margin-bottom:30px;
  }
  .back-link:hover{ color:var(--chalk); }
  .sport-hero-top{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .sport-badge{
    width:78px; height:78px; border-radius:16px;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:2rem; letter-spacing:0.03em;
    flex:none;
    box-shadow:0 14px 30px -8px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .sport-hero h1{ font-size:clamp(3rem,8vw,5.4rem); color:var(--chalk); }
  .sport-hero .tagline{ color:var(--accent); font-size:1.15rem; margin-top:8px; font-weight:600; }

  .content-grid{
    display:grid; grid-template-columns:1.5fr 1fr; gap:60px; margin-top:54px;
  }
  @media (max-width:900px){ .content-grid{ grid-template-columns:1fr; gap:40px; } }
  .lede{ font-size:1.15rem; line-height:1.7; color:var(--chalk-dim); max-width:640px; }

  /* scoreboard */
  .scoreboard{
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    display:grid; grid-template-columns:1fr 1fr; gap:1px;
    background-image:none;
  }
  .scoreboard-cell{
    padding:16px 18px;
    border-bottom:1px solid var(--line-soft);
  }
  .scoreboard-cell:nth-child(odd){ border-right:1px solid var(--line-soft); }
  .scoreboard-label{
    font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--chalk-dim);
    margin-bottom:6px;
  }
  .scoreboard-value{
    font-family:'JetBrains Mono'; font-weight:700; color:var(--accent); font-size:1.18rem;
    text-shadow:0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
  }

  h2.h-block{
    font-size:1.9rem; color:var(--chalk); margin:0 0 20px;
    padding-bottom:14px; border-bottom:1px solid var(--line);
  }
  .subsection{ margin-top:58px; }

  .rules-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .rules-list li{
    display:flex; gap:14px; align-items:flex-start;
    padding:16px 18px; background:var(--pitch-2); border:1px solid var(--line); border-radius:12px;
    font-size:0.96rem; line-height:1.55; color:var(--chalk);
  }
  .rules-list li .tick{
    flex:none; width:22px; height:22px; border-radius:50%;
    background:color-mix(in srgb, var(--accent) 25%, transparent);
    color:var(--accent); display:flex; align-items:center; justify-content:center;
    font-size:0.75rem; font-weight:800; margin-top:2px;
  }

  .skills-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .skill-chip{
    padding:10px 18px; border-radius:999px;
    border:1px solid var(--line); background:var(--pitch-2);
    font-size:0.9rem; color:var(--chalk);
  }
  .skill-chip::before{ content:'●'; color:var(--accent); margin-right:8px; font-size:0.6rem; }

  .gear-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:16px;
  }
  @media (max-width:900px){ .gear-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .gear-grid{ grid-template-columns:1fr; } }
  .gear-card{
    border:1px solid var(--line); background:var(--pitch-2); border-radius:12px; padding:20px;
    display:flex; flex-direction:column; gap:8px;
  }
  .gear-name{ font-weight:700; font-size:1.02rem; }
  .gear-price{ font-family:'JetBrains Mono'; color:var(--accent); font-size:0.88rem; font-weight:700; }
  .gear-desc{ color:var(--chalk-dim); font-size:0.87rem; line-height:1.5; flex:1; }
  .gear-link{
    margin-top:6px; font-size:0.8rem; font-weight:700; color:var(--accent);
    display:inline-flex; align-items:center; gap:6px;
  }

  .academy-box{
    border:1px solid var(--line); background:var(--pitch-2); border-radius:var(--radius);
    padding:26px;
  }
  .academy-box p{ color:var(--chalk-dim); font-size:0.92rem; line-height:1.6; margin:0 0 18px; }
  .academy-actions{ display:flex; flex-direction:column; gap:12px; }
  .academy-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .city-input{
    flex:1; min-width:140px;
    background:var(--ink); border:1px solid var(--line); color:var(--chalk);
    padding:12px 14px; border-radius:9px; font-size:0.9rem; font-family:inherit;
  }
  .city-input::placeholder{ color:var(--chalk-dim); }
  .btn-sm{ padding:12px 18px; border-radius:9px; font-size:0.86rem; }
  .geo-note{ font-size:0.76rem; color:var(--chalk-dim); margin-top:2px; }

  .injury-box{
    border:1px solid var(--line); background:var(--pitch-2); border-radius:var(--radius);
    padding:26px;
  }
  .injury-box > p{ color:var(--chalk-dim); font-size:0.92rem; line-height:1.6; margin:0 0 18px; }
  .injury-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .injury-select{
    flex:1; min-width:180px;
    background:var(--ink); border:1px solid var(--line); color:var(--chalk);
    padding:12px 14px; border-radius:9px; font-size:0.9rem; font-family:inherit;
  }
  .injury-result{
    margin-top:18px; padding:18px 20px; border-radius:12px;
    background:var(--ink); border:1px solid var(--line);
    display:none;
  }
  .injury-result.show{ display:block; }
  .injury-result h4{
    font-family:'Bebas Neue'; font-size:1.3rem; color:var(--accent); letter-spacing:0.02em; margin-bottom:10px;
  }
  .injury-result .symptoms{ color:var(--chalk-dim); font-size:0.86rem; margin-bottom:14px; line-height:1.5; }
  .injury-result .care-list{ list-style:none; margin:0 0 16px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .injury-result .care-list li{
    font-size:0.92rem; line-height:1.5; color:var(--chalk); display:flex; gap:10px; align-items:flex-start;
  }
  .injury-result .care-list li::before{ content:'✓'; color:var(--accent); font-weight:800; flex:none; }
  .injury-disclaimer{
    font-size:0.78rem; color:var(--chalk-dim); border-top:1px solid var(--line-soft); padding-top:12px; margin-top:4px;
  }
  .physio-finder{ margin-top:16px; padding-top:16px; border-top:1px solid var(--line-soft); display:none; }
  .physio-finder.show{ display:block; }
  .physio-finder p{ color:var(--chalk-dim); font-size:0.85rem; margin:0 0 12px; }

  .lesson-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
  @media (max-width:900px){ .lesson-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .lesson-grid{ grid-template-columns:1fr; } }
  .lesson-card{
    border:1px solid var(--line); background:var(--pitch-2); border-radius:12px; padding:20px;
    display:flex; flex-direction:column; gap:8px;
  }
  .lesson-card .lesson-kicker{
    font-size:0.7rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); font-weight:700;
  }
  .lesson-name{ font-weight:700; font-size:1rem; }
  .lesson-desc{ color:var(--chalk-dim); font-size:0.87rem; line-height:1.5; flex:1; }
  .lesson-link{
    margin-top:6px; font-size:0.8rem; font-weight:700; color:var(--accent);
    display:inline-flex; align-items:center; gap:6px;
  }

  .other-sports{ display:flex; flex-wrap:wrap; gap:10px; }
  .pill{
    padding:9px 16px; border-radius:999px; border:1px solid var(--line);
    font-size:0.85rem; background:var(--pitch-2);
  }
  .pill:hover{ border-color:var(--accent); color:var(--accent); }

  .fade-in{ animation:fadeIn .5s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
</style>
</head>

<div id="app"></div>

      ["Tennis balls","₹400 – ₹2,000 / can","Pressurised balls for matches; pressureless for practice."],
      ["Court shoes","₹3,000 – ₹15,000","Hard-court, clay or grass outsoles for grip."],
      ["Vibration dampener","₹100 – ₹800","Reduces string vibration and changes feel slightly."],
      ["Tennis bag","₹1,500 – ₹8,000","Carries rackets, shoes, balls and accessories."]
    ],
    injuries:[
      { name:"Tennis elbow (lateral epicondylitis)", symptoms:"Outer-elbow pain when gripping the racquet or hitting backhands.",
        care:["Rest from strokes that aggravate it, especially backhand","Ice the elbow after activity","Eccentric wrist-extensor stretches once acute pain eases","Check grip size and string tension — both add elbow load"] },
      { name:"Ankle sprain (lateral movement)", symptoms:"Rolled ankle from a quick side step, swelling, pain weight-bearing.",
        care:["RICE right away","Avoid weight-bearing for a day or two if painful","Support with taping or a brace on return","Footwork drills at low intensity before full-speed play"] },
      { name:"Rotator cuff strain (serve motion)", symptoms:"Pain in the shoulder overhead, especially during the serve.",
        care:["Reduce serve volume for a few days","Ice the shoulder after sessions","Rotator-cuff and scapular strengthening once pain settles","Have your serve technique reviewed by a coach"] },
      { name:"Lower back strain (serve arch/twist)", symptoms:"Ache in the lower back after serving or hitting overheads.",
        care:["Rest from serving for a few days","Core-stability exercises between sessions","Alternate ice and heat as needed","See a physio if the ache recurs regularly"] }

];

const bySlug = s => SPORTS.find(x=>x.slug===s);

/* ================= ICONS ================= */
const ARROW = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 11L11 3M11 3H4M11 3V10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHEV_LEFT = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ================= RENDER: HOME ================= */
function renderHome(){
  const cards = SPORTS.map(s => `
    <a class="card fade-in" href="#/sports/${s.slug}" style="--tint:${s.accent}">
      <span class="card-photo"><img src="${s.photo}" alt="${s.name} action" loading="lazy"></span>
      <span class="card-body">
        <span class="card-mono">${s.mono}</span>
        <span class="card-name">${s.name}</span>
        <span class="card-tag">${s.tagline}</span>
        <span class="card-cta">Explore ${ARROW}</span>
      </span>
    </a>
  `).join('');

  const ticker = Array(2).fill(SPORTS.map(s=>`<span class="ticker-item"><b>${s.mono}</b>${s.name}</span>`).join('')).join('');

  return `
    <header class="topbar">
      <div class="wrap">
        <a class="brand" href="#/">
          <span class="dot"></span>
          <span class="brand-word">PlayFinder</span>
        </a>
        <nav><a href="#choose">Choose a sport</a></nav>
      </div>
    </header>

    <div class="ticker"><div class="ticker-track">${ticker}</div></div>

    <section class="hero">
      <div class="wrap">
        <span class="hero-eyebrow">Twelve sports · one start line</span>
        <h1>Pick your sport.<br>Find your <span>game.</span></h1>
        <p class="hero-sub">Scroll the line-up, pick the game that pulls at you, and get everything that comes next — the rules, the skills, the kit, and the academies closest to you.</p>
        <a class="btn" href="#choose">Choose your sport ${ARROW}</a>
      </div>
    </section>

    <section class="section" id="choose">
      <div class="wrap">
        <div class="section-head">
          <div>
            <span class="section-eyebrow">The line-up</span>
            <h2>Which one is yours?</h2>
          </div>
          <p>Pick a sport to unlock its full guide — the game, the rules, the training kit and academies near you.</p>
        </div>
        <div class="grid">${cards}</div>
      </div>
    </section>

    <footer>
      <div class="wrap">
        <span>PlayFinder — rules, gear and academies for every sport.</span>
        <span>Built for players who haven't picked a game yet.</span>
      </div>
    </footer>
  `;
}

/* ================= RENDER: SPORT PAGE ================= */
function renderSport(slug){
  const s = bySlug(slug);
  if(!s) return renderNotFound();

  const stats = s.stats.map(([label,value])=>`
    <div class="scoreboard-cell">
      <div class="scoreboard-label">${label}</div>
      <div class="scoreboard-value">${value}</div>
    </div>
  `).join('');

  const rules = s.rules.map(r=>`<li><span class="tick">✓</span><span>${r}</span></li>`).join('');
  const skills = s.skills.map(sk=>`<span class="skill-chip">${sk}</span>`).join('');
  const gear = s.gear.map(([name,price,desc])=>`
    <div class="gear-card">
      <div class="gear-name">${name}</div>
      <div class="gear-price">${price}</div>
      <div class="gear-desc">${desc}</div>
      <a class="gear-link" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=shop&q=${encodeURIComponent(s.name+' '+name)}">Shop options ${ARROW}</a>
    </div>
  `).join('');

  const injuryOptions = s.injuries.map((inj,i)=>`<option value="${i}">${inj.name}</option>`).join('');

  const lessonSources = [
    { kicker:"Beginner fundamentals", label:`${s.name} tutorial for beginners`, desc:`Start-from-scratch technique and setup, built around ${s.skills[0].toLowerCase()} and the other basics.` },
    { kicker:"Pro technique breakdown", label:`${s.name} technique breakdown pro`, desc:`Slow-motion form checks and coaching breakdowns from top-level ${s.name.toLowerCase()} players.` },
    { kicker:"Training drills", label:`${s.name} training drills`, desc:`Structured drills top creators use to build ${s.skills[Math.min(2,s.skills.length-1)].toLowerCase()} and match fitness.` }
  ];
  const lessons = lessonSources.map(l=>`
    <div class="lesson-card">
      <div class="lesson-kicker">${l.kicker}</div>
      <div class="lesson-name">${s.name}: ${l.kicker.toLowerCase()}</div>
      <div class="lesson-desc">${l.desc}</div>
      <a class="lesson-link" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(l.label)}">Watch on YouTube ${ARROW}</a>
    </div>
  `).join('');

  const others = SPORTS.filter(x=>x.slug!==s.slug).map(x=>`<a class="pill" href="#/sports/${x.slug}">${x.name}</a>`).join('');

  return `
    <header class="topbar">
      <div class="wrap">
        <a class="brand" href="#/">
          <span class="dot"></span>
          <span class="brand-word">PlayFinder</span>
        </a>
        <nav><a href="#/">All sports</a></nav>
      </div>
    </header>

    <section class="sport-hero" style="--accent:${s.accent}">
      <div class="sport-photo">
        <img src="${s.photo}" alt="${s.name} action">
        <span class="sport-photo-caption">${s.photoCredit}</span>
      </div>
      <div class="wrap">
        <a class="back-link" href="#/">${CHEV_LEFT} All sports</a>
        <div class="sport-hero-top">
          <div class="sport-badge">${s.mono}</div>
          <div>
            <h1>${s.name}</h1>
            <div class="tagline">${s.tagline}</div>
          </div>
        </div>

        <div class="content-grid">
          <div>
            <h2 class="h-block">The game</h2>
            <p class="lede">${s.desc}</p>
          </div>
          <div class="scoreboard">${stats}</div>
        </div>
      </div>
    </section>

    <section class="section" style="--accent:${s.accent}; padding-top:56px;">
      <div class="wrap">

        <div class="subsection" style="margin-top:0;">
          <h2 class="h-block">Rules that matter</h2>
          <ul class="rules-list">${rules}</ul>
        </div>

        <div class="subsection">
          <h2 class="h-block">Skills to train</h2>
          <div class="skills-row">${skills}</div>
        </div>

        <div class="subsection">
          <h2 class="h-block">Gear &amp; accessories</h2>
          <p style="color:var(--chalk-dim); margin:-10px 0 22px; font-size:0.95rem;">What to buy first, and roughly what it costs.</p>
          <div class="gear-grid">${gear}</div>
        </div>

        <div class="subsection">
          <h2 class="h-block">Injury detector</h2>
          <div class="injury-box">
            <p>Picked up a niggle playing ${s.name.toLowerCase()}? Pick what's bothering you for some general self-care steps — this isn't a diagnosis, so see a doctor or physio for anything severe, sudden, or not improving.</p>
            <div class="injury-row">
              <select class="injury-select" id="injurySelect">
                <option value="" selected disabled>Select an injury…</option>
                ${injuryOptions}
              </select>
              <button class="btn btn-sm" id="injuryBtn" style="background:${s.accent}">Get care tips</button>
            </div>
            <div class="injury-result" id="injuryResult">
              <h4 id="injuryName"></h4>
              <div class="symptoms" id="injurySymptoms"></div>
              <ul class="care-list" id="injuryCare"></ul>
              <div class="injury-disclaimer">This is general guidance, not medical advice. If pain is severe, sudden, or not improving within a few days, get it checked by a professional.</div>
            </div>
            <div class="physio-finder" id="physioFinder">
              <p>Ready to see someone? Find a sports physiotherapist near you.</p>
              <div class="academy-actions">
                <div class="academy-row">
                  <button class="btn btn-sm" id="physioGeoBtn" style="background:${s.accent}">Use my location</button>
                </div>
                <div class="geo-note" id="physioGeoNote"></div>
                <div class="academy-row">
                  <input class="city-input" id="physioCityInput" placeholder="Or type a city, e.g. Mumbai">
                  <button class="btn btn-ghost btn-sm" id="physioCitySearchBtn">Search</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="subsection">
          <h2 class="h-block">Learn from the pros</h2>
          <p style="color:var(--chalk-dim); margin:-10px 0 22px; font-size:0.95rem;">Top-rated ${s.name.toLowerCase()} lessons and breakdowns from creators worth following.</p>
          <div class="lesson-grid">${lessons}</div>
        </div>

        <div class="subsection">
          <h2 class="h-block">Academies near you</h2>
          <div class="academy-box">
            <p>Share your location and we'll pull up coaching centres, clubs and grounds for ${s.name.toLowerCase()} around you. Prefer not to? Type a city instead.</p>
            <div class="academy-actions">
              <div class="academy-row">
                <button class="btn btn-sm" id="geoBtn" style="background:${s.accent}">Use my location</button>
              </div>
              <div class="geo-note" id="geoNote"></div>
              <div class="academy-row">
                <input class="city-input" id="cityInput" placeholder="Or type a city, e.g. Mumbai">
                <button class="btn btn-ghost btn-sm" id="citySearchBtn">Search</button>
              </div>
            </div>
          </div>
        </div>

        <div class="subsection">
          <h2 class="h-block">Try another sport</h2>
          <div class="other-sports">${others}</div>
        </div>

      </div>
    </section>

    <footer>
      <div class="wrap">
        <span>PlayFinder — rules, gear and academies for every sport.</span>
        <a href="#/">Back to all sports</a>
      </div>
    </footer>
  `;
}

function renderNotFound(){
  return `
    <header class="topbar">
      <div class="wrap">
        <a class="brand" href="#/"><span class="dot"></span><span class="brand-word">PlayFinder</span></a>
      </div>
    </header>
    <section class="section"><div class="wrap">
      <h1 style="font-size:3rem;">Sport not found</h1>
      <p style="color:var(--chalk-dim); margin:16px 0 26px;">That guide doesn't exist yet.</p>
      <a class="btn" href="#/">Back to all sports</a>
    </div></section>
  `;
}

/* ================= ROUTER ================= */
function wireSportPageEvents(slug){
  const s = bySlug(slug);
  if(!s) return;
  const geoBtn = document.getElementById('geoBtn');
  const geoNote = document.getElementById('geoNote');
  const cityInput = document.getElementById('cityInput');
  const cityBtn = document.getElementById('citySearchBtn');

  geoBtn && geoBtn.addEventListener('click', ()=>{
    if(!navigator.geolocation){
      geoNote.textContent = "Location isn't available in this browser — try typing a city instead.";
      return;
    }
    geoNote.textContent = "Finding your location…";
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const {latitude, longitude} = pos.coords;
        geoNote.textContent = "";
        window.open(`https://www.google.com/maps/search/${encodeURIComponent(s.name+' academy')}/@${latitude},${longitude},13z`, '_blank');
      },
      ()=>{
        geoNote.textContent = "Couldn't access your location — try typing a city instead.";
      }
    );
  });

  cityBtn && cityBtn.addEventListener('click', ()=>{
    const city = cityInput.value.trim();
    const q = city ? `${s.name} academy ${city}` : `${s.name} academy`;
    window.open(`https://www.google.com/maps/search/${encodeURIComponent(q)}`, '_blank');
  });

  /* ---- injury detector ---- */
  const injurySelect = document.getElementById('injurySelect');
  const injuryBtn = document.getElementById('injuryBtn');
  const injuryResult = document.getElementById('injuryResult');
  const injuryName = document.getElementById('injuryName');
  const injurySymptoms = document.getElementById('injurySymptoms');
  const injuryCare = document.getElementById('injuryCare');
  const physioFinder = document.getElementById('physioFinder');

  injuryBtn && injuryBtn.addEventListener('click', ()=>{
    const idx = injurySelect.value;
    if(idx === '') return;
    const inj = s.injuries[Number(idx)];
    injuryName.textContent = inj.name;
    injurySymptoms.textContent = `Common symptoms: ${inj.symptoms}`;
    injuryCare.innerHTML = inj.care.map(c=>`<li>${c}</li>`).join('');
    injuryResult.classList.add('show');
    physioFinder.classList.add('show');
  });

  /* ---- physio locator ---- */
  const physioGeoBtn = document.getElementById('physioGeoBtn');
  const physioGeoNote = document.getElementById('physioGeoNote');
  const physioCityInput = document.getElementById('physioCityInput');
  const physioCityBtn = document.getElementById('physioCitySearchBtn');

  physioGeoBtn && physioGeoBtn.addEventListener('click', ()=>{
    if(!navigator.geolocation){
      physioGeoNote.textContent = "Location isn't available in this browser — try typing a city instead.";
      return;
    }
    physioGeoNote.textContent = "Finding your location…";
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const {latitude, longitude} = pos.coords;
        physioGeoNote.textContent = "";
        window.open(`https://www.google.com/maps/search/${encodeURIComponent('sports physiotherapist')}/@${latitude},${longitude},13z`, '_blank');
      },
      ()=>{
        physioGeoNote.textContent = "Couldn't access your location — try typing a city instead.";
      }
    );
  });

  physioCityBtn && physioCityBtn.addEventListener('click', ()=>{
    const city = physioCityInput.value.trim();
    const q = city ? `sports physiotherapist ${city}` : 'sports physiotherapist';
    window.open(`https://www.google.com/maps/search/${encodeURIComponent(q)}`, '_blank');
  });
}

function render(){
  const hash = location.hash || '#/';
  const app = document.getElementById('app');
  const m = hash.match(/^#\/sports\/([a-z0-9-]+)/);

  if(m){
    const slug = m[1];
    const s = bySlug(slug);
    app.innerHTML = renderSport(slug);
    document.title = s ? `${s.name} Guide — Rules, Gear & Academies | PlayFinder` : 'Sport not found | PlayFinder';
    wireSportPageEvents(slug);
  } else {
    app.innerHTML = renderHome();
    document.title = 'PlayFinder — Pick Your Sport, Find Your Game';
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
</script>
